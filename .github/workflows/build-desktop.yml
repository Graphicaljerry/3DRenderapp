# Builds the native desktop apps — macOS (Apple Silicon .dmg) and Windows (x64 .exe
# installer) — automatically, from the same web build.
#
# Runs on EVERY push to main (docs/harness-only commits skipped). Both platforms build
# in parallel, then ONE publish job refreshes the rolling "desktop-latest" pre-release
# holding both installers. That gives the download page two permanent URLs:
#
#   .../releases/download/desktop-latest/Moldable_aarch64.dmg     (macOS, Apple Silicon)
#   .../releases/download/desktop-latest/Moldable_x64-setup.exe   (Windows 10/11, x64)
#
# Publishing is a separate job on purpose: if each build published itself, the two
# runners would race to recreate the same release and clobber each other's asset.
#
# Pushing a v* tag additionally cuts a normal versioned Release with both installers.
#
# Both are UNSIGNED (free). First run: macOS → right-click → Open; Windows → SmartScreen
# "More info" → "Run anyway". Add the signing secrets to remove those prompts.
name: Build desktop apps (macOS + Windows)

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Commits that can't change the app. NOTE: path filters also apply to tag pushes,
    # so if you tag a docs-only commit, start the build by hand from the Actions tab.
    paths-ignore:
      - "docs/**"
      - "harness/**"
      - "**/*.md"
  workflow_dispatch: {}

permissions:
  contents: write # create/refresh the Release

concurrency:
  group: build-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.label }}
    strategy:
      fail-fast: false # a Windows failure must not throw away a good macOS build
      matrix:
        include:
          - label: macOS (Apple Silicon)
            os: macos-14
            rust_target: aarch64-apple-darwin
            bundles: app,dmg
            bundle_glob: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            asset: Moldable_aarch64.dmg
            # Silent-update payload: the .app tarball the updater swaps in, + its signature.
            updater_glob: src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz
            updater_asset: Moldable_aarch64.app.tar.gz
            platform_key: darwin-aarch64
          - label: Windows (x64)
            os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            bundles: nsis
            bundle_glob: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
            asset: Moldable_x64-setup.exe
            # On Windows the updater runs the NSIS installer itself — same file, signed.
            updater_glob: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
            updater_asset: Moldable_x64-setup.exe
            platform_key: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the app's status-bar version is the COMMIT COUNT, and the
          # installer is stamped from it. A shallow clone would ship the app as "v1".
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: moldable-lite/package-lock.json

      - name: Setup Rust (${{ matrix.rust_target }})
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache cargo build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: moldable-lite/src-tauri -> target
          key: ${{ matrix.rust_target }}

      - name: Install JS deps
        working-directory: moldable-lite
        run: npm ci

      # The installer's version mirrors the app's own status-bar number (the commit
      # count), so a download is traceable to a deploy: app v220 → Moldable 0.2.220.
      - name: Stamp the app version onto the bundle
        working-directory: moldable-lite
        shell: bash
        run: |
          set -euo pipefail
          export N=$(git rev-list --count HEAD)
          node -e "
            const fs = require('fs'), f = 'src-tauri/tauri.conf.json';
            const j = JSON.parse(fs.readFileSync(f, 'utf8'));
            j.version = '0.2.' + process.env.N;
            fs.writeFileSync(f, JSON.stringify(j, null, 2) + '\n');
          "
          echo "Stamped Moldable 0.2.$N"

      # The signing key is one long base64 line. Pasting it into the GitHub secrets box
      # can introduce a line break (it did once: the build died with "failed to decode
      # base64 key: Invalid symbol 10" — symbol 10 being a newline). Base64 carries no
      # whitespace, so stripping it is always safe and makes the secret paste-proof.
      - name: Normalise the update-signing key
        env:
          RAW_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${RAW_SIGNING_KEY:-}" ]; then
            echo "HAS_SIGNING_KEY=false" >> "$GITHUB_ENV"
            echo "No signing key configured — this build ships installers only."
            exit 0
          fi
          # Written to a file through a QUOTED heredoc: bash performs no substitution,
          # so the program below is verbatim JS. (Inlining it in `node -e "…"` meant
          # YAML, bash and JS escaping all applied at once — that broke silently.)
          cat > "$RUNNER_TEMP/normalise-key.cjs" <<'NORMALISE_KEY'
          const raw = process.env.RAW_SIGNING_KEY || "";
          const MARK = "rsign encrypted secret key";
          // Tauri wants base64-of-the-.key-file. Accept either thing a human might
          // paste — that base64 (wrapped or not), or the decoded file text — and
          // normalise. Only shapes are logged, never key material.
          console.log(`secret as stored: ${raw.length} chars, ${(raw.match(/\s/g) || []).length} whitespace`);
          const stripped = raw.replace(/\s+/g, "");
          const decoded = Buffer.from(stripped, "base64").toString("utf8");
          let out = null, how = "";
          if (decoded.includes(MARK)) {
            out = stripped;                       // A) base64 of the key file
            how = "base64-wrapped key file";
          } else if (raw.includes(MARK)) {        // B) the key file pasted as text
            const line = raw.split(/\r?\n/).map((l) => l.trim()).filter(Boolean)
              .find((l) => !l.startsWith("untrusted comment:"));
            if (line) {
              out = Buffer.from(`untrusted comment: ${MARK}\n${line}\n`, "utf8").toString("base64");
              how = "raw key file text";
            }
          }
          // 8 hex of a SHA-256 — enough to tell "this is the right key file" apart from
          // "this is a mangled copy", useless to anyone else.
          const fp = (s) => require("crypto").createHash("sha256").update(s).digest("hex").slice(0, 8);
          if (!out) {
            console.log("decoded first line:", JSON.stringify(decoded.split("\n")[0].slice(0, 40)));
            console.log("fingerprint of what is stored:", fp(stripped));
            console.log("::error::TAURI_SIGNING_PRIVATE_KEY is not a valid rsign private key — most likely a copy that lost or altered a character. Set it straight from the file instead of pasting: `gh secret set TAURI_SIGNING_PRIVATE_KEY < moldable-updater.key`, or `pbcopy < moldable-updater.key` and paste that.");
            process.exit(1);
          }
          console.log("::add-mask::" + out);      // before it can reach any later log
          console.log("recognised as:", how, "· fingerprint:", fp(out));
          require("fs").appendFileSync(process.env.GITHUB_ENV, `TAURI_SIGNING_PRIVATE_KEY=${out}\nHAS_SIGNING_KEY=true\n`);
          NORMALISE_KEY
          node "$RUNNER_TEMP/normalise-key.cjs"

      # Signed update artifacts need the private key. Until it exists as a secret the
      # build must still succeed — so turn the updater artifacts off for that run and
      # ship installers only (the app falls back to "download the installer").
      - name: Skip updater artifacts when no signing key is configured
        if: ${{ env.HAS_SIGNING_KEY != 'true' }}
        working-directory: moldable-lite
        shell: bash
        run: |
          set -euo pipefail
          node -e "
            const fs = require('fs'), f = 'src-tauri/tauri.conf.json';
            const j = JSON.parse(fs.readFileSync(f, 'utf8'));
            j.bundle.createUpdaterArtifacts = false;
            fs.writeFileSync(f, JSON.stringify(j, null, 2) + '\n');
          "
          echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set — building without silent-update artifacts."

      - name: Build the app + installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # TAURI_SIGNING_PRIVATE_KEY is NOT set here on purpose — the normalise step
          # above exported the whitespace-stripped key through $GITHUB_ENV, and a
          # step-level env entry would shadow it with the raw (possibly wrapped) secret.
          #
          # The key was generated WITHOUT a password. GitHub refuses to store an empty
          # secret value, so this secret intentionally does not exist — an unset secret
          # resolves to "", which is the password. Don't "fix" this by inventing one:
          # the password must match the key, and changing the key changes the pubkey in
          # tauri.conf.json, which would orphan every already-installed app.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # ---- macOS signing + notarization (uncomment once the Apple account exists) ----
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: moldable-lite
          # No tagName — publishing happens once, in the job below, so the assets keep
          # STABLE filenames (a versioned name would break the permanent download URLs).
          args: --target ${{ matrix.rust_target }} --bundles ${{ matrix.bundles }}

      - name: Give the installer a stable filename
        working-directory: moldable-lite
        shell: bash
        run: |
          set -euo pipefail
          SRC=$(ls ${{ matrix.bundle_glob }} | head -1)
          cp "$SRC" "../${{ matrix.asset }}"
          ls -lh "../${{ matrix.asset }}"

      # The updater payload + its detached signature, plus a tiny json describing this
      # platform's entry. The publish job merges those into one latest.json.
      - name: Collect the silent-update payload
        shell: bash
        working-directory: moldable-lite
        run: |
          set -euo pipefail
          SIG=$(ls ${{ matrix.updater_glob }}.sig 2>/dev/null | head -1 || true)
          if [ -z "$SIG" ]; then
            echo "No signed update artifact this run — installers only."
            exit 0
          fi
          PAYLOAD=$(ls ${{ matrix.updater_glob }} | head -1)
          cp "$PAYLOAD" "../${{ matrix.updater_asset }}"
          node -e "
            const fs = require('fs');
            fs.writeFileSync('../updater-${{ matrix.platform_key }}.json', JSON.stringify({
              '${{ matrix.platform_key }}': {
                signature: fs.readFileSync(process.argv[1], 'utf8').trim(),
                url: 'https://github.com/${{ github.repository }}/releases/download/desktop-latest/${{ matrix.updater_asset }}',
              },
            }));
          " "$SIG"
          ls -lh "../${{ matrix.updater_asset }}" "../updater-${{ matrix.platform_key }}.json"

      - name: Upload for the publish job
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}
            ${{ matrix.updater_asset }}
            updater-${{ matrix.platform_key }}.json
          if-no-files-found: error

  publish:
    name: Publish the downloads
    needs: build
    if: always() && contains(needs.build.result, 'success') # publish whatever built
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # commit count → the release title

      - name: Collect the installers
        uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          export N=$(git rev-list --count HEAD) # exported: the node script below reads it
          ls -lh installers/
          # Merge each platform's signed entry into ONE latest.json — the manifest the
          # installed app polls to update itself. Absent when no signing key is set,
          # in which case the app falls back to offering the installer download.
          node -e "
            const fs = require('fs');
            const parts = fs.readdirSync('installers').filter((f) => /^updater-.*\.json\$/.test(f));
            if (!parts.length) { console.log('no signed update entries — installers only'); process.exit(0); }
            const platforms = Object.assign({}, ...parts.map((f) => JSON.parse(fs.readFileSync('installers/' + f, 'utf8'))));
            fs.writeFileSync('installers/latest.json', JSON.stringify({
              version: '0.2.' + process.env.N,
              notes: 'Moldable v' + process.env.N + ' — see the release notes.',
              pub_date: new Date().toISOString(),
              platforms,
            }, null, 2));
            console.log('latest.json covers:', Object.keys(platforms).join(', '));
          "
          FILES=$(find installers -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.app.tar.gz' -o -name 'latest.json' \) | tr '\n' ' ')
          # Say on the release itself whether this build can update itself, so it's
          # visible at a glance rather than only in the workflow log.
          if [ -f installers/latest.json ]; then
            UPDATES="Installed copies update themselves from this release — no re-download."
          else
            UPDATES="Unsigned build: installed copies will offer the installer instead of self-updating."
          fi
          NOTES="Native desktop builds of Moldable (v${N}).

          **macOS** (Apple Silicon) — \`Moldable_aarch64.dmg\`
          Drag Moldable to Applications, then **right-click the app → Open** the first time.
          If macOS says the app is \"damaged\": \`xattr -cr /Applications/Moldable.app\`

          **Windows 10/11** (x64) — \`Moldable_x64-setup.exe\`
          Run the installer. SmartScreen may warn on first run — click **More info → Run anyway**.

          Both are unsigned beta builds, which is why those one-time prompts appear.

          ${UPDATES}"

          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
            gh release create "$TAG" --title "Moldable $TAG" --notes "$NOTES" $FILES \
              || gh release upload "$TAG" $FILES --clobber
          else
            # Rolling build: recreate so the tag follows main and the permanent
            # /download/desktop-latest/ URLs serve this build.
            gh release delete desktop-latest --yes --cleanup-tag 2>/dev/null || true
            gh release create desktop-latest \
              --prerelease \
              --target "$GITHUB_SHA" \
              --title "Moldable — latest desktop builds (v${N})" \
              --notes "$NOTES" \
              $FILES
          fi
