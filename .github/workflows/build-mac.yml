# Builds the native macOS (Apple Silicon) .dmg of Moldable — automatically.
#
# Runs on EVERY push to main (skipping docs/harness-only commits), so the Mac app
# tracks the web app with no manual step. Each build refreshes a rolling
# "mac-latest" pre-release, which gives the download page ONE permanent URL:
#
#   https://github.com/Graphicaljerry/3DRenderapp/releases/download/mac-latest/Moldable_aarch64.dmg
#
# Pushing a v* tag additionally cuts a normal versioned Release with the same DMG,
# for milestone builds you want to keep around.
#
# Signing/notarization is OFF (unsigned beta — users right-click → Open the first
# time). Add the APPLE_* repo secrets and uncomment the env block for a clean,
# Gatekeeper-approved download; no other change needed.
name: Build macOS DMG (Apple Silicon)

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Skip builds for commits that can't change the app. NOTE: path filters also
    # apply to tag pushes, so if you ever tag a docs-only commit, kick the build
    # off by hand from the Actions tab.
    paths-ignore:
      - "docs/**"
      - "harness/**"
      - "**/*.md"
  workflow_dispatch: {}

permissions:
  contents: write # create/refresh the Release

# A newer push supersedes an in-flight build of the same ref.
concurrency:
  group: build-mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    runs-on: macos-14 # Apple Silicon (arm64) → aarch64-apple-darwin host
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the app's status-bar version is the COMMIT COUNT, and the
          # DMG is stamped from it too. A shallow clone would ship the app as "v1".
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: moldable-lite/package-lock.json

      - name: Setup Rust (aarch64-apple-darwin)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache cargo build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: moldable-lite/src-tauri -> target

      - name: Install JS deps
        working-directory: moldable-lite
        run: npm ci

      # The DMG's version mirrors the app's own status-bar number (the commit count),
      # so a downloaded build is traceable to a deploy: app v218 → Moldable 0.2.218.
      - name: Stamp the app version onto the bundle
        working-directory: moldable-lite
        shell: bash
        run: |
          set -euo pipefail
          export N=$(git rev-list --count HEAD)
          node -e "
            const fs = require('fs'), f = 'src-tauri/tauri.conf.json';
            const j = JSON.parse(fs.readFileSync(f, 'utf8'));
            j.version = '0.2.' + process.env.N;
            fs.writeFileSync(f, JSON.stringify(j, null, 2) + '\n');
          "
          echo "APP_VERSION=v$N" >> "$GITHUB_ENV"
          echo "Stamped Moldable 0.2.$N"

      - name: Build Moldable.app + .dmg
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ---- Signing + notarization (uncomment once the Apple account + secrets exist) ----
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}                 # base64 of the Developer ID Application .p12
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}       # "Developer ID Application: Name (TEAMID)"
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}                       # app-specific password
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: moldable-lite # where src-tauri/ + package.json live
          args: --target aarch64-apple-darwin
          # No tagName here on purpose — publishing is handled in the step below so
          # the asset gets a STABLE filename (a versioned name would break the
          # permanent download URL every release).

      - name: Give the DMG a stable filename
        run: |
          set -euo pipefail
          SRC=$(ls moldable-lite/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg | head -1)
          cp "$SRC" Moldable_aarch64.dmg
          ls -lh Moldable_aarch64.dmg

      - name: Publish the download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NOTES="Native macOS build for Apple Silicon (${APP_VERSION}).

          Unsigned beta: after dragging Moldable to Applications, **right-click the app → Open** the first time.
          If macOS says the app is \"damaged\", run: xattr -cr /Applications/Moldable.app"

          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
            gh release create "$TAG" --title "Moldable $TAG" --notes "$NOTES" Moldable_aarch64.dmg \
              || gh release upload "$TAG" Moldable_aarch64.dmg --clobber
          else
            # Rolling build: recreate so the tag always points at the newest commit
            # and the permanent /download/mac-latest/ URL serves this build.
            gh release delete mac-latest --yes --cleanup-tag 2>/dev/null || true
            gh release create mac-latest \
              --prerelease \
              --target "$GITHUB_SHA" \
              --title "Moldable — latest Mac build (${APP_VERSION})" \
              --notes "$NOTES" \
              Moldable_aarch64.dmg
          fi

      - name: Also keep the .dmg as a run artifact
        uses: actions/upload-artifact@v4
        with:
          name: moldable-macos-dmg
          path: Moldable_aarch64.dmg
          if-no-files-found: warn
