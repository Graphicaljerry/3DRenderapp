[package]
name = "moldable"
version = "0.2.0"
description = "Moldable — AI 3D design for printing"
authors = ["Graphicaljerry"]
edition = "2021"

# The library the desktop (and future mobile) entry points call into.
[lib]
name = "moldable_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"  # durable key/value on disk — keeps the account signed in
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Silent updates: the updater downloads + swaps the app bundle in place, `process`
# supplies the restart. Desktop only — there is no updater on mobile targets.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
